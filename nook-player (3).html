<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nook — local player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.7/jsmediatags.min.js"></script>
<style>
  :root{
    --bg: #e8e6e1;
    --bg-hi: #ffffff;
    --bg-lo: #c9c6bd;
    --ink: #3d3934;
    --ink-soft: #8b8579;
    --ink-faint: #b3ada0;
    --accent: #d97a52;
    --accent-hi: #e89a76;
    --accent-lo: #b85f3a;
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    height:100dvh;
    padding: clamp(10px, 3vw, 28px);
    display:flex;
    overflow:hidden;
  }
  @media (max-height: 560px){
    body{ overflow-y:auto; }
  }

  .neu-out{ background:var(--bg); box-shadow: 8px 8px 16px var(--bg-lo), -8px -8px 16px var(--bg-hi); }
  .neu-in{ background:var(--bg); box-shadow: inset 5px 5px 10px var(--bg-lo), inset -5px -5px 10px var(--bg-hi); }
  .neu-btn{
    background:var(--bg);
    box-shadow: 5px 5px 10px var(--bg-lo), -5px -5px 10px var(--bg-hi);
    transition: box-shadow .12s ease, transform .08s ease;
    cursor:pointer; border:none; color:var(--ink);
  }
  .neu-btn:active{ box-shadow: inset 3px 3px 6px var(--bg-lo), inset -3px -3px 6px var(--bg-hi); transform: scale(.98); }

  .app{
    width:100%; height:100%; max-width: 960px; margin:0 auto;
    border-radius: 32px;
    padding: clamp(14px, 2.6vw, 30px);
    display:flex;
    flex-direction:column;
    gap: clamp(10px, 1.8vh, 20px);
    min-height:0;
  }

  header{
    flex:0 0 auto;
    display:flex; align-items:baseline; justify-content:space-between;
    grid-area: header;
  }
  .brand{ font-family:'Fraunces', serif; font-weight:600; font-size: clamp(18px,3.2vw,26px); letter-spacing: -0.01em; }
  .brand span{ color: var(--accent); }
  .tagline{ font-size: clamp(10px,1.6vw,12.5px); color:var(--ink-soft); letter-spacing:.03em; }

  .panel{
    border-radius: var(--radius-lg);
    padding: clamp(12px, 2vw, 22px);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .panel-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.12em;
    color:var(--ink-soft); font-weight:600; margin: 2px 0 10px 2px; flex:0 0 auto;
  }
  .collapse-toggle{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    width:100%; border:none; background:none; padding:0; cursor:pointer; font:inherit;
    color:var(--ink-soft);
  }
  .chevron{ width:14px; height:14px; flex-shrink:0; transition: transform .18s ease; }
  .list-panel.collapsed .chevron{ transform: rotate(-90deg); }
  .list-panel.collapsed .track-list{ display:none; }
  .list-panel.collapsed{ flex:0 0 auto; }

  .list-panel{ flex:1 1 auto; min-height:0; grid-area: list; }

  .upload-row{ display:flex; gap:10px; margin-bottom:12px; flex:0 0 auto; }
  .upload-btn{
    flex:1; border-radius: var(--radius-sm); padding: 10px 16px;
    font-weight:600; font-size:13.5px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    color: var(--accent-lo);
  }
  input[type=file]{ display:none; }

  .add-track-menu{ position:relative; flex:1; }
  .add-track-menu .upload-btn{ width:100%; }
  .dropdown-arrow{ font-size:11px; margin-left:2px; }
  .add-track-dropdown{
    position:absolute; left:0; right:0; top:calc(100% + 8px); z-index:50;
    display:none; flex-direction:column; gap:6px; padding:8px;
    border-radius: var(--radius-sm);
    background:var(--bg);
    box-shadow: 8px 8px 16px var(--bg-lo), -8px -8px 16px var(--bg-hi);
  }
  .add-track-dropdown.open{ display:flex; }
  .add-track-dropdown button{
    border:none; background:var(--bg); color:var(--ink);
    padding:10px 12px; border-radius:10px; text-align:left; cursor:pointer; font:inherit;
  }
  .add-track-dropdown button:hover{
    box-shadow: inset 3px 3px 6px var(--bg-lo), inset -3px -3px 6px var(--bg-hi);
  }

  .track-list{
    flex:1 1 auto; min-height:0; overflow-y:auto;
    display:flex; flex-direction:column; gap:7px; padding-right: 4px;
  }
  .track-list::-webkit-scrollbar{ width:6px; }
  .track-list::-webkit-scrollbar-thumb{ background: var(--bg-lo); border-radius:6px; }

  .group-row{
    display:flex; align-items:center; gap:10px; width:100%;
    border:none; background:none; cursor:pointer; font:inherit; color:var(--ink);
    padding: 9px 8px; border-radius: var(--radius-sm); text-align:left;
  }
  .group-row:hover{ box-shadow: 3px 3px 6px var(--bg-lo), -3px -3px 6px var(--bg-hi); }
  .group-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .group-meta{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .group-label{ font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .group-sub{ font-size:10.5px; color:var(--ink-faint); }
  .group-right{ font-size:11px; color:var(--ink-soft); font-weight:600; flex-shrink:0; }
  .group-chevron{ flex-shrink:0; transform: rotate(-90deg); }
  .group-row.open .group-chevron{ transform: rotate(0deg); }
  .group-tracks{
    flex-direction:column; gap:6px;
    padding: 4px 0 8px 20px;
    margin-bottom: 4px;
    border-left: 2px solid var(--bg-lo);
  }

  .track{ border-radius: var(--radius-sm); padding: 8px 10px; display:flex; align-items:center; gap:10px; cursor:pointer; flex:0 0 auto; }
  .track.playing{ box-shadow: inset 4px 4px 8px var(--bg-lo), inset -4px -4px 8px var(--bg-hi); }
  .track:not(.playing):hover{ box-shadow: 3px 3px 6px var(--bg-lo), -3px -3px 6px var(--bg-hi); }

  .track-dot{
    position:relative; width:32px; height:32px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:#fff; overflow:visible;
  }
  .track-dot img{ width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .cover-btn{
    position:absolute; bottom:-3px; right:-3px; width:16px; height:16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:8px;
    background:var(--bg); box-shadow: 2px 2px 4px var(--bg-lo), -1px -1px 3px var(--bg-hi);
    border:none; color:var(--ink-soft); cursor:pointer; opacity:0; transition:opacity .12s;
  }
  .track:hover .cover-btn{ opacity:1; }

  .track-meta{ flex:1; min-width:0; }
  .track-name{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track.playing .track-name{ color:var(--accent-lo); }
  .track-sub{ font-size:10.5px; color:var(--ink-faint); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-time{ font-size:11px; color:var(--ink-faint); flex-shrink:0; }
  .track-remove{
    flex-shrink:0; width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-faint); background:none; border:none; cursor:pointer;
    font-size:13px; opacity:0; transition:opacity .12s;
  }
  .track:hover .track-remove{ opacity:1; }
  .track-remove:hover{ color:var(--accent-lo); }

  .empty-state{
    flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:var(--ink-faint); font-size:12.5px; gap:6px; padding: 10px;
  }
  .empty-state b{ color:var(--ink-soft); font-weight:600; }

  .now-panel{ align-items:center; text-align:center; flex:0 0 auto; grid-area: now; justify-content:center; }

  .disc-wrap{
    position:relative;
    width: clamp(100px, 22vh, 190px); height: clamp(100px, 22vh, 190px);
    margin: 4px 0 clamp(8px,1.8vh,18px);
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
  }
  #bars{ position:absolute; inset:0; }
  .disc{
    width:72%; height:72%; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--accent-hi), var(--accent-lo) 70%);
    background-size:cover; background-position:center;
    box-shadow: 6px 6px 14px var(--bg-lo), -6px -6px 14px var(--bg-hi);
    display:flex; align-items:center; justify-content:center;
    animation: spin 9s linear infinite; animation-play-state: paused;
  }
  .disc.spinning{ animation-play-state: running; }
  .disc::after{
    content:''; width:30%; height:30%; border-radius:50%;
    background:var(--bg);
    box-shadow: inset 2px 2px 5px var(--bg-lo), inset -2px -2px 5px var(--bg-hi);
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .now-title{ font-family:'Fraunces', serif; font-weight:600; font-size: clamp(15px,2.4vh,21px); max-width: 300px; line-height:1.25; flex:0 0 auto; }
  .now-sub{ font-size: clamp(10px,1.6vh,12.5px); color:var(--ink-soft); margin-top:3px; flex:0 0 auto; }

  .progress-row{
    width:100%; display:flex; align-items:center; gap:10px;
    margin: clamp(10px,2vh,22px) 0 clamp(10px,1.6vh,20px);
    font-size:10.5px; color:var(--ink-faint); flex:0 0 auto;
  }
  .progress-track{ flex:1; height:8px; border-radius:8px; position:relative; cursor:pointer; }
  .progress-fill{ position:absolute; left:0; top:0; bottom:0; border-radius:8px; background: linear-gradient(90deg, var(--accent), var(--accent-hi)); width:0%; }

  .controls{ display:flex; align-items:center; justify-content:center; gap:14px; flex:0 0 auto; }
  .ctrl-btn{ border-radius:50%; width: clamp(36px,6vh,44px); height: clamp(36px,6vh,44px); display:flex; align-items:center; justify-content:center; font-size:15px; }
  .ctrl-btn.play{ width: clamp(50px,8vh,60px); height: clamp(50px,8vh,60px); color: var(--accent-lo); }
  .ctrl-btn svg{ width:15px; height:15px; }
  .ctrl-btn.play svg{ width:19px; height:19px; }

  .volume-row{ display:flex; align-items:center; gap:8px; margin-top: clamp(10px,2vh,24px); width: 70%; flex:0 0 auto; }
  .volume-row span{ font-size:11px; color:var(--ink-faint); }
  input[type=range].vol{
    -webkit-appearance:none; flex:1; height:6px; border-radius:6px;
    background:var(--bg); box-shadow: inset 3px 3px 6px var(--bg-lo), inset -3px -3px 6px var(--bg-hi);
  }
  input[type=range].vol::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background: var(--accent); box-shadow: 2px 2px 4px var(--bg-lo); cursor:pointer;
  }

  /* mobile: stacked flex, DOM order = header, now-panel, list-panel */
  @media (max-width: 879px){
    .app{ display:flex; }
    /* When expanded on mobile, the playlist takes over the full screen —
       mirroring how spacious the desktop's dedicated playlist column is —
       instead of being squeezed into the stacked layout. */
    .list-panel:not(.collapsed){
      position:fixed; inset:0; z-index:200;
      border-radius:0; margin:0;
      width:100%; height:100%;
      padding: calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
    }
  }

  /* desktop / landscape: two-column grid, order defined by grid-area, not DOM */
  @media (min-width: 880px){
    .app{
      display:grid;
      grid-template-columns: 1.05fr 1fr;
      grid-template-rows: auto 1fr;
      grid-template-areas: "header header" "list now";
    }
    .list-panel{ height:100%; }
    .now-panel{ height:100%; justify-content:center; }
    /* the accordion/full-page behavior is a mobile space-saving affordance —
       desktop already has a dedicated, spacious playlist column, so keep it
       fully visible regardless of collapsed state */
    .list-panel.collapsed{ flex:1 1 auto; }
    .list-panel .track-list{ display:flex !important; }
    .collapse-toggle{ cursor:default; }
  }

  @media (prefers-reduced-motion: reduce){ .disc{ animation:none; } }
  :focus-visible{ outline: 2px solid var(--accent-lo); outline-offset: 2px; }
</style>
</head>
<body>

<div class="app neu-out">
  <header>
    <div>
      <div class="brand">nook<span>.</span></div>
      <div class="tagline">your music, played from right here</div>
    </div>
  </header>

  <section class="panel now-panel neu-in">
    <div class="panel-title" style="align-self:flex-start;">Now playing</div>
    <div class="disc-wrap">
      <svg id="bars" viewBox="0 0 210 210"></svg>
      <div class="disc" id="disc"></div>
    </div>
    <div class="now-title" id="nowTitle">Nothing queued</div>
    <div class="now-sub" id="nowSub">Add a track to begin</div>

    <div class="progress-row">
      <span id="curTime">0:00</span>
      <div class="progress-track neu-in" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span id="durTime">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl-btn neu-btn" id="prevBtn" title="Previous" aria-label="Previous track">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn play neu-btn" id="playBtn" title="Play" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn neu-btn" id="nextBtn" title="Next" aria-label="Next track">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
    </div>

    <div class="volume-row">
      <span>Vol</span>
      <input type="range" class="vol" id="volSlider" min="0" max="1" step="0.01" value="0.85">
    </div>
  </section>

  <section class="panel list-panel collapsed neu-in">
    <button class="panel-title collapse-toggle" id="listToggle" type="button" aria-expanded="false">
      <span id="listTitle">Playlist</span>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="upload-row">
      <div class="add-track-menu">
        <button class="upload-btn neu-btn" id="addTrackBtn" type="button" aria-haspopup="menu" aria-expanded="false">
          + Add tracks <span class="dropdown-arrow">⌄</span>
        </button>
        <div class="add-track-dropdown" id="addTrackDropdown">
          <button type="button" id="addFilesBtn">Add audio files</button>
          <button type="button" id="addFolderBtn">Add folder</button>
        </div>
      </div>
      <input type="file" id="fileInput" accept="audio/*" multiple hidden>
      <input type="file" id="folderInput" accept="audio/*,image/*" webkitdirectory directory multiple hidden>
    </div>
    <div class="track-list" id="trackList">
      <div class="empty-state" id="emptyState">
        <b>Nothing loaded yet</b>
        <span>Add audio files from your device to start listening.</span>
      </div>
    </div>
  </section>
</div>

<input type="file" id="coverInput" accept="image/*" style="display:none">

<script>
(function(){
  const fileInput = document.getElementById('fileInput');
  const folderInput = document.getElementById('folderInput');
  const addTrackBtn = document.getElementById('addTrackBtn');
  const addTrackDropdown = document.getElementById('addTrackDropdown');
  const addFilesBtn = document.getElementById('addFilesBtn');
  const addFolderBtn = document.getElementById('addFolderBtn');
  const coverInput = document.getElementById('coverInput');
  const trackListEl = document.getElementById('trackList');
  const listToggle = document.getElementById('listToggle');
  const listPanel = document.querySelector('.list-panel');
  const emptyState = document.getElementById('emptyState');
  const listTitle = document.getElementById('listTitle');
  const nowTitle = document.getElementById('nowTitle');
  const nowSub = document.getElementById('nowSub');
  const disc = document.getElementById('disc');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const progressTrack = document.getElementById('progressTrack');
  const progressFill = document.getElementById('progressFill');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');
  const volSlider = document.getElementById('volSlider');
  const barsSvg = document.getElementById('bars');

  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  const PALETTE = ['#d97a52','#7c9473','#c98a3f','#8b7ba8','#5f9ea8','#b8695f'];

  const audio = new Audio();
  audio.volume = parseFloat(volSlider.value);

  let tracks = [];      // {name, artist, title, url, dur, file, cover, coverSource: 'folder'|'embedded'|'manual'|null}
  let currentIndex = -1;
  let pendingCoverIndex = -1;
  const expandedGroups = new Set();
  let audioCtx, analyser, sourceNode, freqData;
  const NUM_BARS = 40;
  const barEls = [];

  const cx = 105, cy = 105, rIn = 82, rOut = 100;
  for (let i = 0; i < NUM_BARS; i++){
    const angle = (i / NUM_BARS) * Math.PI * 2;
    const x1 = cx + rIn * Math.cos(angle);
    const y1 = cy + rIn * Math.sin(angle);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x1); line.setAttribute('y2', y1);
    line.setAttribute('stroke', '#d97a52');
    line.setAttribute('stroke-width', '3');
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('opacity', '0.55');
    barsSvg.appendChild(line);
    barEls.push({el: line, angle, x1, y1});
  }

  function formatTime(s){
    if (!isFinite(s) || s < 0) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }
  function baseName(name){ return name.replace(/\.[^/.]+$/, ''); }
  // Downloader apps (e.g. SnapTube) often save cover art as "Song Name_thumb.jpg"
  // rather than "Song Name.jpg". Strip that kind of trailing suffix so it still
  // matches the audio file's base name.
  function stripThumbSuffix(name){ return name.replace(/[\s_-]*(thumb(nail)?|cover|art(work)?|folder)\s*$/i, ''); }
  function initials(name){ const base = baseName(name); return base.trim().slice(0,2).toUpperCase() || '♪'; }

  function buildTrackRow(t, i){
    const row = document.createElement('div');
    row.className = 'track' + (i === currentIndex ? ' playing' : '');
    const dotInner = t.cover ? `<img src="${t.cover}" alt="">` : initials(t.name);
    row.innerHTML = `
      <div class="track-dot" style="${t.cover ? '' : `background:${PALETTE[i % PALETTE.length]}`}">
        ${dotInner}
        <button class="cover-btn" title="Set cover photo" aria-label="Set cover photo">📷</button>
      </div>
      <div class="track-meta">
        <div class="track-name">${t.title || baseName(t.name)}</div>
        <div class="track-sub">${i === currentIndex ? (audio.paused ? 'Paused' : 'Playing') : (t.artist || 'Local file')}</div>
      </div>
      <div class="track-time">${t.dur ? formatTime(t.dur) : '--:--'}</div>
      <button class="track-remove" aria-label="Remove track" title="Remove">✕</button>
    `;
    row.addEventListener('click', (e) => {
      if (e.target.closest('.track-remove') || e.target.closest('.cover-btn')) return;
      playTrack(i);
    });
    row.querySelector('.track-remove').addEventListener('click', (e) => {
      e.stopPropagation();
      removeTrack(i);
    });
    row.querySelector('.cover-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      pendingCoverIndex = i;
      coverInput.value = '';
      coverInput.click();
    });
    return row;
  }

  // Groups tracks by artist (falls back to "Local files" when unknown),
  // preserving the order artists first appear in.
  function buildGroups(){
    const map = new Map();
    tracks.forEach((t, i) => {
      const key = (t.artist || 'Local files').trim() || 'Local files';
      if (!map.has(key)) map.set(key, { key, indices: [] });
      map.get(key).indices.push(i);
    });
    return Array.from(map.values());
  }

  function renderList(){
    trackListEl.innerHTML = '';
    if (tracks.length === 0){
      emptyState.style.display = 'flex';
      trackListEl.appendChild(emptyState);
      listTitle.textContent = 'Playlist';
      return;
    }
    emptyState.style.display = 'none';
    listTitle.textContent = `Playlist · ${tracks.length} track${tracks.length>1?'s':''}`;

    const groups = buildGroups();
    groups.forEach((g, gi) => {
      if (g.indices.includes(currentIndex)) expandedGroups.add(g.key);
      const isOpen = expandedGroups.has(g.key);
      const knownDurs = g.indices.map(i => tracks[i].dur).filter(d => d);
      const totalDur = knownDurs.length === g.indices.length ? knownDurs.reduce((a,b) => a+b, 0) : null;

      const groupRow = document.createElement('button');
      groupRow.type = 'button';
      groupRow.className = 'group-row' + (isOpen ? ' open' : '');
      groupRow.setAttribute('aria-expanded', String(isOpen));
      groupRow.innerHTML = `
        <span class="group-dot" style="background:${PALETTE[gi % PALETTE.length]}"></span>
        <span class="group-meta">
          <span class="group-label">${g.key}</span>
          <span class="group-sub">${g.indices.length} track${g.indices.length>1?'s':''}</span>
        </span>
        <span class="group-right">${totalDur ? formatTime(totalDur) : ''}</span>
        <svg class="chevron group-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      `;
      groupRow.addEventListener('click', () => {
        if (expandedGroups.has(g.key)) expandedGroups.delete(g.key); else expandedGroups.add(g.key);
        renderList();
      });
      trackListEl.appendChild(groupRow);

      const nested = document.createElement('div');
      nested.className = 'group-tracks';
      nested.style.display = isOpen ? 'flex' : 'none';
      g.indices.forEach(i => nested.appendChild(buildTrackRow(tracks[i], i)));
      trackListEl.appendChild(nested);
    });
  }

  function removeTrack(i){
    const wasCurrent = i === currentIndex;
    URL.revokeObjectURL(tracks[i].url);
    if (tracks[i].cover) URL.revokeObjectURL(tracks[i].cover);
    tracks.splice(i, 1);
    if (wasCurrent){
      audio.pause();
      currentIndex = -1;
      setPaused();
      nowTitle.textContent = 'Nothing queued';
      nowSub.textContent = 'Add a track to begin';
      progressFill.style.width = '0%';
      curTimeEl.textContent = '0:00';
      durTimeEl.textContent = '0:00';
      updateDiscArt(null, -1);
    } else if (i < currentIndex){
      currentIndex--;
    }
    renderList();
  }

  function setupAnalyser(){
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sourceNode = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
  }

  function updateDiscArt(t, i){
    if (t && t.cover){
      disc.style.backgroundImage = `url(${t.cover})`;
    } else {
      disc.style.backgroundImage = 'none';
      const color = i >= 0 ? PALETTE[i % PALETTE.length] : 'var(--accent-hi)';
      disc.style.background = `radial-gradient(circle at 35% 30%, ${color}, #3d3934 140%)`;
    }
  }

  function playTrack(i){
    currentIndex = i;
    const t = tracks[i];
    audio.src = t.url;
    setupAnalyser();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    audio.play();
    nowTitle.textContent = t.title || baseName(t.name);
    nowSub.textContent = t.artist ? `${t.artist} · from your device` : 'Playing from your device';
    updateDiscArt(t, i);
    renderList();
  }

  function setPlaying(){ disc.classList.add('spinning'); playIcon.innerHTML = ICON_PAUSE; playBtn.setAttribute('aria-label','Pause'); }
  function setPaused(){ disc.classList.remove('spinning'); playIcon.innerHTML = ICON_PLAY; playBtn.setAttribute('aria-label','Play'); }

  playBtn.addEventListener('click', () => {
    if (currentIndex === -1){ if (tracks.length) playTrack(0); return; }
    if (audio.paused){
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      audio.play();
    } else { audio.pause(); }
  });
  prevBtn.addEventListener('click', () => {
    if (!tracks.length) return;
    playTrack(currentIndex <= 0 ? tracks.length - 1 : currentIndex - 1);
  });
  nextBtn.addEventListener('click', () => {
    if (!tracks.length) return;
    playTrack(currentIndex >= tracks.length - 1 ? 0 : currentIndex + 1);
  });

  audio.addEventListener('play', () => { setPlaying(); renderList(); });
  audio.addEventListener('pause', () => { setPaused(); renderList(); });
  audio.addEventListener('ended', () => { nextBtn.click(); });
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    progressFill.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
    curTimeEl.textContent = formatTime(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', () => {
    durTimeEl.textContent = formatTime(audio.duration);
    if (currentIndex > -1) tracks[currentIndex].dur = audio.duration;
  });

  progressTrack.addEventListener('click', (e) => {
    if (!audio.duration) return;
    const rect = progressTrack.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    audio.currentTime = ratio * audio.duration;
  });
  volSlider.addEventListener('input', () => { audio.volume = parseFloat(volSlider.value); });

  function readTags(track){
    if (typeof jsmediatags === 'undefined') return;
    jsmediatags.read(track.file, {
      onSuccess: (tag) => {
        const tags = tag.tags || {};
        if (tags.title) track.title = tags.title;
        if (tags.artist) track.artist = tags.artist;
        if (tags.picture && track.coverSource !== 'manual' && track.coverSource !== 'embedded'){
          const {data, format} = tags.picture;
          const arr = new Uint8Array(data);
          const blob = new Blob([arr], { type: format });
          if (track.cover) URL.revokeObjectURL(track.cover); // drop the folder-matched image in favor of embedded art
          track.cover = URL.createObjectURL(blob);
          track.coverSource = 'embedded';
          if (tracks[currentIndex] === track) updateDiscArt(track, currentIndex);
        }
        renderList();
      },
      onError: () => {}
    });
  }

  // Shared track-creation helper. `imageFiles` (optional) maps lowercase
  // base filename -> image File, used to match external cover art when a
  // whole folder is selected. Embedded ID3 artwork (via readTags) is read
  // asynchronously right after and, once available, overrides a folder-matched
  // image (but never a manually-picked cover) — see readTags' coverSource check.
  function addTracksFromFiles(files, imageFiles){
    const audioFiles = files.filter(f => f.type.startsWith('audio/'));
    audioFiles.forEach(file => {
      const exists = tracks.some(t => t.name === file.name);
      if (exists) return;

      let coverUrl = null;
      if (imageFiles){
        const key = baseName(file.name).toLowerCase();
        const coverFile = imageFiles.get(key);
        if (coverFile) coverUrl = URL.createObjectURL(coverFile);
      }

      const track = { name: file.name, artist: null, title: null, url: URL.createObjectURL(file), dur: null, file, cover: coverUrl, coverSource: coverUrl ? 'folder' : null };
      tracks.push(track);
      readTags(track); // embedded artwork, once read, overrides the folder-image cover above
    });
    renderList();
    if (currentIndex === -1 && tracks.length) playTrack(0);
  }

  function closeAddMenu(){
    addTrackDropdown.classList.remove('open');
    addTrackBtn.setAttribute('aria-expanded', 'false');
  }

  addTrackBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = addTrackDropdown.classList.toggle('open');
    addTrackBtn.setAttribute('aria-expanded', String(open));
  });
  addFilesBtn.addEventListener('click', () => {
    closeAddMenu();
    fileInput.value = '';
    fileInput.click();
  });
  addFolderBtn.addEventListener('click', () => {
    closeAddMenu();
    folderInput.value = '';
    folderInput.click();
  });
  document.addEventListener('click', closeAddMenu);

  listToggle.addEventListener('click', () => {
    const collapsed = listPanel.classList.toggle('collapsed');
    listToggle.setAttribute('aria-expanded', String(!collapsed));
  });

  fileInput.addEventListener('change', (e) => {
    addTracksFromFiles(Array.from(e.target.files), null);
    fileInput.value = '';
  });

  folderInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    const imageFiles = new Map();
    files.forEach(file => {
      if (file.type.startsWith('image/')){
        const base = baseName(file.name).toLowerCase();
        imageFiles.set(base, file);                          // exact match, e.g. "Song.jpg"
        imageFiles.set(stripThumbSuffix(base), file);         // suffix-stripped, e.g. "Song_thumb.jpg" -> "Song"
      }
    });
    addTracksFromFiles(files, imageFiles);
    folderInput.value = '';
  });

  coverInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file || pendingCoverIndex === -1) return;
    const t = tracks[pendingCoverIndex];
    if (t.cover) URL.revokeObjectURL(t.cover);
    t.cover = URL.createObjectURL(file);
    t.coverSource = 'manual';
    if (pendingCoverIndex === currentIndex) updateDiscArt(t, currentIndex);
    renderList();
    pendingCoverIndex = -1;
  });

  function tick(){
    requestAnimationFrame(tick);
    if (!analyser || audio.paused){
      barEls.forEach(b => { b.el.setAttribute('x2', b.x1); b.el.setAttribute('y2', b.y1); });
      return;
    }
    analyser.getByteFrequencyData(freqData);
    const step = Math.floor(freqData.length / NUM_BARS);
    barEls.forEach((b, i) => {
      const v = freqData[i * step] / 255;
      const r = rIn + v * (rOut - rIn);
      b.el.setAttribute('x2', cx + r * Math.cos(b.angle));
      b.el.setAttribute('y2', cy + r * Math.sin(b.angle));
    });
  }
  requestAnimationFrame(tick);

  renderList();
  updateDiscArt(null, -1);
})();
</script>
</body>
</html>
